events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip nén dữ liệu giúp tải trang siêu nhanh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Giới hạn kích thước file upload
    client_max_body_size 15M;

    # Rate Limiting chống tấn công DDoS & brute force
    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=lead_form_limit:10m rate=3r/m;

    upstream nextjs_upstream {
        server web:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Áp dụng rate limit cơ bản cho mọi request
        limit_req zone=ip_limit burst=30 nodelay;

        # Cache tài nguyên tĩnh của Next.js
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_set_header Host $host;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Cache hình ảnh public
        location /images/ {
            proxy_pass http://nextjs_upstream;
            proxy_set_header Host $host;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Rate limit khắt khe hơn đối với API gửi leads / báo giá
        location /api/leads {
            limit_req zone=lead_form_limit burst=5 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy mặc định đến ứng dụng Next.js
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
