version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret-in-production-2026}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost}
    volumes:
      - app_data:/app/data
      - app_uploads:/app/public/uploads
    networks:
      - htc_network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
    depends_on:
      - web
    networks:
      - htc_network

volumes:
  app_data:
  app_uploads:
  certbot_etc:
  certbot_var:

networks:
  htc_network:
    driver: bridge
